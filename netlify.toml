[build]
  command = "bash scripts/build-netlify.sh"
  publish = "netlify-dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200
  force = true

[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200
  force = true
